<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Snackpot</title>
  <meta name="description" content="Snackpot — a 3D vending machine prize game. One tap to play." />
  <meta name="theme-color" content="#6fcfff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Snackpot" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="top">
      <div class="pill balance" title="Play credits"><i class="coin"></i><b id="balance">0.00</b></div>
      <div class="top-right" data-ui>
        <button class="icon-btn" id="btn-info" aria-label="Collection and info">
          <svg viewBox="0 0 24 24"><path d="M8 7V6a4 4 0 0 1 8 0v1h2.5a1.5 1.5 0 0 1 1.5 1.6l-.8 10A2.6 2.6 0 0 1 16.6 21H7.4a2.6 2.6 0 0 1-2.6-2.4L4 8.6A1.5 1.5 0 0 1 5.5 7H8Zm2 0h4V6a2 2 0 0 0-4 0v1Z"/></svg>
          <span id="bag-count" hidden>0</span>
        </button>
        <button class="icon-btn" id="btn-sound" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" id="ico-sound"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Zm11.2-1.7a1 1 0 0 1 1.4.1 6.3 6.3 0 0 1 0 8.2 1 1 0 1 1-1.5-1.3 4.3 4.3 0 0 0 0-5.6 1 1 0 0 1 .1-1.4Z"/></svg>
        </button>
      </div>
    </div>
    <div id="win"><span class="win-label">WIN</span><span id="win-value">0.00</span></div>
    <div id="callout"></div>
    <div id="banner"></div>
    <div id="popups"></div>
    <div class="bottom">
      <div id="prompt"></div>
      <div class="pill bet" data-ui>
        <button id="bet-down" aria-label="Lower bet">−</button>
        <div class="bet-mid"><small>BET</small><b id="bet">1.00</b></div>
        <button id="bet-up" aria-label="Raise bet">+</button>
      </div>
    </div>
    <div id="fast" hidden>▶▶</div>
  </div>

  <div id="modal" data-ui hidden>
    <div class="sheet">
      <button class="close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="loader"><div class="logo">SNACKPOT</div><div class="bar"><i></i></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
